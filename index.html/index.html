<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RIFT - 2D Online Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;color:#eaf7ff;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}.panel{background:#0b1025ee;border:1px solid #2a3c65;border-radius:18px;box-shadow:0 16px 50px #0009}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#192653,#070914 68%);padding:16px}
.card{width:min(94vw,460px);padding:25px;text-align:center}.logo{font-size:38px;font-weight:1000;letter-spacing:3px;color:#67eaff;text-shadow:0 0 25px #14bde8}.desc{color:#a9badb;margin:5px 0 20px}
input{width:100%;padding:13px;margin:6px 0;background:#090f22;border:1px solid #34466e;border-radius:10px;color:#fff;font-size:16px}
button{border:0;border-radius:11px;padding:13px 16px;background:linear-gradient(100deg,#1bc8e5,#7883ff);color:#06101e;font-size:15px;font-weight:900;cursor:pointer}
button:disabled{opacity:.4}#host,#join{width:100%;margin-top:8px}#err{color:#ff829f;min-height:24px;font-size:13px;margin-top:8px}
.note{font-size:11px;color:#8fa3c8;line-height:1.6;margin-top:14px}
#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;gap:8px;pointer-events:none}
.hudbox{padding:9px 13px;min-width:100px}.muted{font-size:11px;color:#9aafd4}.value{font-size:21px;font-weight:900}
#board{position:fixed;right:12px;top:82px;width:180px;padding:11px;display:none;pointer-events:none}
#board h3{margin:0 0 7px;color:#66eaff;font-size:13px}.rank{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
#lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,390px);padding:20px;text-align:center;display:none}
#count{font-size:30px;font-weight:900;color:#6beaff}#names{font-size:12px;color:#a7badb;min-height:35px}
#dash{position:fixed;right:22px;bottom:24px;width:82px;height:82px;border-radius:50%;background:#12344c;border:2px solid #8bf5ff;color:#c9fbff;display:none}
#stick{position:fixed;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;background:#a9eaff20;border:1px solid #a9eaff66;display:none;touch-action:none}
#knob{position:absolute;left:42px;top:42px;width:46px;height:46px;border-radius:50%;background:#67eaffaa;border:2px solid #c9fbff}
#result{position:fixed;inset:0;background:#050817e8;display:none;place-items:center;padding:16px}
#result .card{max-height:85vh;overflow:auto}
@media(pointer:coarse){#stick{display:block}#dash{display:block}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu"><div class="card panel">
 <div class="logo">NEON RIFT</div><div class="desc">20인 실시간 에너지 쟁탈전</div>
 <input id="nick" maxlength="14" placeholder="닉네임" value="PLAYER">
 <input id="room" maxlength="12" placeholder="방 코드 (영문/숫자)" value="RIFT">
 <button id="host">방 만들기 (방장)</button><button id="join">방 참가하기</button>
 <div id="err"></div>
 <div class="note">WASD / 방향키 이동 · SPACE 대시<br>에너지 코어를 모으고 대시로 상대의 점수를 빼앗으세요.<br>방장은 경기 시작 버튼을 누를 수 있습니다.</div>
</div></div>
<div id="hud">
 <div class="hudbox panel"><div class="muted">내 점수</div><div class="value" id="score">0</div></div>
 <div class="hudbox panel"><div class="muted">남은 시간</div><div class="value" id="timer">03:00</div></div>
 <div class="hudbox panel"><div class="muted">방 / 인원</div><div class="value" id="roomlabel">RIFT · 1/20</div></div>
</div>
<div id="board" class="panel"><h3>TOP PLAYERS</h3><div id="ranks"></div></div>
<div id="lobby" class="panel"><div class="logo" style="font-size:25px">대기실</div><p>친구에게 방 코드를 알려주세요.</p><div id="count">1 / 20</div><div id="names"></div><p id="roomcode"></p><button id="start" disabled>경기 시작 (2명 이상)</button></div>
<button id="dash">DASH</button>
<div id="stick"><div id="knob"></div></div>
<div id="result"><div class="card panel"><div class="logo">MATCH RESULT</div><h2 id="winner"></h2><div id="final"></div><br><button onclick="location.reload()">메뉴로</button></div></div>
<script>
(()=> {
const $=id=>document.getElementById(id), canvas=$('cv'),ctx=canvas.getContext('2d');
const W=1800,H=1100,MAX=20,DURATION=180000;
let peer=null,host=false,hostConn=null,connections=new Map(),players=new Map(),orbs=[];
let myId='',myName='',roomCode='',running=false,endsAt=0,lastTick=0,lastSpawn=0,cam={x:0,y:0},keys={},touchMove={x:0,y:0},lastState=null;
const colors=['#50e3ff','#ff5d9e','#a78bfa','#fbbf24','#67e8a5','#fb8b4b','#8ba7ff'];
const rand=(a,b)=>Math.random()*(b-a)+a, now=()=>Date.now();
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function err(s){$('err').textContent=s}
function safeName(s){return String(s||'PLAYER').trim().slice(0,14)||'PLAYER'}
function createPlayer(id,name){return {id,name:safeName(name),x:rand(120,W-120),y:rand(120,H-120),score:0,color:colors[Math.floor(Math.random()*colors.length)],dx:0,dy:0,dashUntil:0,dashReady:0,stunnedUntil:0}}
function send(conn,data){try{if(conn&&conn.open)conn.send(data)}catch(e){}}
function sendAll(data){for(const c of connections.values())send(c,data)}
function snapshot(){return {type:'state',running,endsAt,players:[...players.values()].map(p=>({id:p.id,name:p.name,x:p.x,y:p.y,score:p.score,color:p.color,dashUntil:p.dashUntil,stunnedUntil:p.stunnedUntil})),orbs:orbs.map(o=>({id:o.id,x:o.x,y:o.y}))}}
function updateLobby(){
 const arr=[...players.values()];$('count').textContent=arr.length+' / '+MAX;
 $('names').textContent=arr.map(p=>p.name).join(' · ');
 $('roomlabel').textContent=roomCode+' · '+arr.length+'/'+MAX;
 $('start').disabled=!host||arr.length<2||running;
}
function spawnOrb(){if(orbs.length<65)orbs.push({id:Math.random().toString(36).slice(2),x:rand(70,W-70),y:rand(70,H-70)})}
function startMatch(){
 if(!host||players.size<2||running)return;
 running=true;endsAt=now()+DURATION;orbs=[];for(let i=0;i<35;i++)spawnOrb();
 for(const p of players.values()){p.score=0;p.x=rand(120,W-120);p.y=rand(120,H-120);p.dashReady=0;p.stunnedUntil=0}
 $('lobby').style.display='none';$('hud').style.display='flex';$('board').style.display='block';
 sendAll({type:'start',endsAt});broadcast();
}
function broadcast(){const s=snapshot();lastState=s;sendAll(s)}
function finish(){
 running=false;const ranking=[...players.values()].sort((a,b)=>b.score-a.score).map((p,i)=>({place:i+1,name:p.name,score:p.score}));
 sendAll({type:'end',ranking});showResult(ranking);
}
function showResult(ranking){
 $('result').style.display='grid';$('winner').textContent=ranking[0]?'🏆 '+ranking[0].name+' 우승!':'경기 종료';
 $('final').innerHTML=ranking.map(p=>`<div class="rank"><span>${p.place}. ${escapeHtml(p.name)}</span><b>${p.score}</b></div>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function enterGame(){
 $('menu').style.display='none';$('lobby').style.display='block';$('roomcode').textContent='방 코드: '+roomCode;
 $('roomlabel').textContent=roomCode+' · '+players.size+'/'+MAX;updateLobby();
}
function setupHost(){
 const code=$('room').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12)||'RIFT';
 roomCode=code;host=true;myName=safeName($('nick').value);myId='host-'+Math.random().toString(36).slice(2,9);
 const peerId='neonrift-'+code.toLowerCase();
 peer=new Peer(peerId,{debug:0});
 peer.on('open',()=>{players.set(myId,createPlayer(myId,myName));enterGame();});
 peer.on('connection',conn=>{
   conn.on('data',data=>{
     if(!data||typeof data!=='object')return;
     if(data.type==='hello'){
       if(players.size>=MAX||running){send(conn,{type:'reject',message:running?'경기가 이미 시작됐습니다.':'방이 가득 찼습니다.'});conn.close();return}
       const id=conn.peer;players.set(id,createPlayer(id,safeName(data.name)));connections.set(id,conn);
       send(conn,{type:'welcome',id,roomCode,world:{w:W,h:H},players:[...players.values()].map(p=>({id:p.id,name:p.name,x:p.x,y:p.y,score:p.score,color:p.color}))});
       conn.on('close',()=>{connections.delete(id);players.delete(id);updateLobby();broadcast()});
       updateLobby();sendAll({type:'lobby',players:[...players.values()].map(p=>({name:p.name}))});
     }else if(data.type==='input'){
       const p=players.get(conn.peer);if(p&&running){let x=Number(data.x)||0,y=Number(data.y)||0,l=Math.hypot(x,y)||1;p.dx=x/l;p.dy=y/l;if(Math.hypot(x,y)<.01){p.dx=0;p.dy=0}}
     }else if(data.type==='dash'){const p=players.get(conn.peer);if(p)doDash(p)}
   });
 });
 peer.on('error',e=>err(e.type==='unavailable-id'?'이미 사용 중인 방 코드입니다. 다른 코드를 사용하세요.':'연결 오류: '+e.type));
}
function setupGuest(){
 const code=$('room').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12)||'RIFT';
 roomCode=code;host=false;myName=safeName($('nick').value);
 peer=new Peer(undefined,{debug:0});
 peer.on('open',()=>{
   hostConn=peer.connect('neonrift-'+code.toLowerCase(),{reliable:true});
   hostConn.on('open',()=>send(hostConn,{type:'hello',name:myName}));
   hostConn.on('data',data=>{
     if(data.type==='reject'){err(data.message);hostConn.close();return}
     if(data.type==='welcome'){
       myId=data.id;players=new Map(data.players.map(p=>[p.id,p]));enterGame();
     }else if(data.type==='lobby'){
       $('count').textContent=data.players.length+' / '+MAX;$('names').textContent=data.players.map(p=>p.name).join(' · ');
       $('roomlabel').textContent=roomCode+' · '+data.players.length+'/'+MAX;
     }else if(data.type==='start'){
       running=true;endsAt=data.endsAt;$('lobby').style.display='none';$('hud').style.display='flex';$('board').style.display='block';
     }else if(data.type==='state'){
       lastState=data;players=new Map(data.players.map(p=>[p.id,p]));orbs=data.orbs;running=data.running;endsAt=data.endsAt;
     }else if(data.type==='end'){running=false;showResult(data.ranking)}
   });
   hostConn.on('close',()=>{if(!running)err('방장과 연결이 끊어졌습니다.')});
 });
 peer.on('error',e=>err(e.type==='peer-unavailable'?'방을 찾을 수 없습니다. 방 코드와 방장 연결을 확인하세요.':'연결 오류: '+e.type));
}
$('host').onclick=()=>{err('방 생성 중...');setupHost()};
$('join').onclick=()=>{err('방 접속 중...');setupGuest()};
$('start').onclick=startMatch;
function doDash(p){const t=now();if(!running||t<p.dashReady||t<p.stunnedUntil)return;p.dashUntil=t+230;p.dashReady=t+3000}
$('dash').addEventListener('pointerdown',e=>{e.preventDefault();if(host)doDash(players.get(myId));else send(hostConn,{type:'dash'})});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();if(host)doDash(players.get(myId));else send(hostConn,{type:'dash'})}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let stickPointer=null;
$('stick').addEventListener('pointerdown',e=>{stickPointer=e.pointerId;$('stick').setPointerCapture(stickPointer);stickUpdate(e)});
$('stick').addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)stickUpdate(e)});
function stickUpdate(e){const r=$('stick').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=47,x=l>m?dx/l*m:dx,y=l>m?dy/l*m:dy;$('knob').style.left=(42+x)+'px';$('knob').style.top=(42+y)+'px';touchMove={x:x/m,y:y/m}}
function stickEnd(){stickPointer=null;touchMove={x:0,y:0};$('knob').style.left='42px';$('knob').style.top='42px'}
$('stick').addEventListener('pointerup',stickEnd);$('stick').addEventListener('pointercancel',stickEnd);
function readMove(){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touchMove.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touchMove.y,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return{x,y}}
setInterval(()=>{
 if(!running)return;const m=readMove();
 if(host){const p=players.get(myId);if(p){p.dx=m.x;p.dy=m.y}}
 else send(hostConn,{type:'input',x:m.x,y:m.y});
},50);
function hostTick(){
 if(!host||!running)return;const t=now();if(t>=endsAt){finish();return}
 if(t-lastSpawn>700){spawnOrb();lastSpawn=t}
 for(const p of players.values()){
   if(t<p.stunnedUntil)continue;
   const speed=t<p.dashUntil?780:245;p.x=Math.max(28,Math.min(W-28,p.x+p.dx*speed/30));p.y=Math.max(28,Math.min(H-28,p.y+p.dy*speed/30));
 }
 for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];for(const p of players.values())if(Math.hypot(p.x-o.x,p.y-o.y)<34){p.score++;orbs.splice(i,1);break}}
 const arr=[...players.values()];
 for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
   const a=arr[i],b=arr[j],dist=Math.hypot(a.x-b.x,a.y-b.y);
   if(dist<42&&t<a.dashUntil&&t>b.stunnedUntil){const n=Math.min(3,b.score);b.score-=n;a.score+=n;b.stunnedUntil=t+650}
   else if(dist<42&&t<b.dashUntil&&t>a.stunnedUntil){const n=Math.min(3,a.score);a.score-=n;b.score+=n;a.stunnedUntil=t+650}
 }
 if(t-lastTick>33){broadcast();lastTick=t}
}
function draw(){
 requestAnimationFrame(draw);const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);
 const g=ctx.createRadialGradient(w/2,h/2,10,w/2,h/2,Math.max(w,h));g.addColorStop(0,'#111d3b');g.addColorStop(1,'#070914');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 const arr=[...players.values()];if(!arr.length)return;
 const me=players.get(myId)||arr[0];cam.x=Math.max(0,Math.min(W-w,me.x-w/2));cam.y=Math.max(0,Math.min(H-h,me.y-h/2));
 ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#0a1329';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1b2b49';ctx.lineWidth=1;
 for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.strokeStyle='#397b9a';ctx.lineWidth=5;ctx.strokeRect(10,10,W-20,H-20);
 for(const o of orbs){ctx.shadowBlur=18;ctx.shadowColor='#42eaff';ctx.fillStyle='#9afaff';ctx.beginPath();ctx.arc(o.x,o.y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 for(const p of arr){ctx.shadowBlur=18;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 if(p.id===myId){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,21,0,Math.PI*2);ctx.stroke()}
 if(now()<p.stunnedUntil){ctx.strokeStyle='#ffec80';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,25,0,Math.PI*2);ctx.stroke()}
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText(p.name,p.x,p.y-27);ctx.fillStyle='#b5c9eb';ctx.font='11px system-ui';ctx.fillText(p.score,p.x,p.y+31)}
 ctx.restore();
 const own=players.get(myId);if(own)$('score').textContent=own.score;
 const sec=Math.max(0,Math.ceil((endsAt-now())/1000));$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 const top=[...players.values()].sort((a,b)=>b.score-a.score).slice(0,8);$('ranks').innerHTML=top.map((p,i)=>`<div class="rank"><span>${i+1}. ${escapeHtml(p.name)}${p.id===myId?' ★':''}</span><b>${p.score}</b></div>`).join('');
}
setInterval(hostTick,1000/30);draw();
})();
</script>
</body></html>
